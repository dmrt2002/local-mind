[package]
name = "local-mind"
version = "1.0.0"
description = "100% Local Cognitive Context Assistant"
authors = ["LocalMind Team"]
license = "MIT"
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset",
    "system-tray",
    "clipboard-all",
    "fs-all",
    "global-shortcut-all",
    "path-all",
    "shell-open",
    "window-close",
    "window-hide",
    "window-maximize",
    "window-minimize",
    "window-set-always-on-top",
    "window-set-focus",
    "window-show",
    "window-start-dragging",
    "window-unmaximize",
    "window-unminimize",
] }
# tauri-plugin-single-instance = "0.1"  # TODO: Find compatible version for tauri 1.5
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
fastembed = "5.2"
llama-cpp-2 = "0.1"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
rdev = "0.4"
parking_lot = "0.12"
lru = "0.12"
once_cell = "1.19"
strsim = "0.11"
regex = "1.10"
unicode-normalization = "0.1"
sysinfo = "0.30"
sha2 = "0.10"
notify = "6.1"
image = "0.24"
imageproc = "0.25"

[dev-dependencies]
criterion = { version = "0.5", features = [] }

[features]
default = []
# encryption = ["sqlcipher"]  # Optional: Enable when sqlcipher is added
ollama = []
